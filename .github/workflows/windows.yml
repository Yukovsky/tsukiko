# Сборка под Windows.
#
# На каждый пуш и pull request запускается быстрая проверка (линтер и тесты).
# Полная сборка приложения (tsukiko.exe), компиляция C++ движка, подготовка ffmpeg
# и создание установщика (tsukiko-setup.exe) выполняются только при наличии флага
# [build] / [build-windows] / [release] в сообщении коммита на main.
# Для пропуска сборки под Windows можно использовать [skip-windows] или [build-macos].

name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверка (линтер и тесты)
    if: >-
      !contains(github.event.head_commit.message, '[skip-windows]') &&
      !contains(github.event.head_commit.message, '[build-macos]')
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - name: Версия
        run: |
          python tool/version.py check
          python -m unittest discover -s tool -p test_version.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Разбор
        run: flutter analyze

      - name: Нативная геометрия плашки (MSVC)
        run: |
          cmake -S tool/native-tests -B build/native-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/native-tests --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/native-tests -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Тесты
        run: flutter test --coverage --reporter expanded

      - name: Покрытие тестами
        uses: actions/upload-artifact@v7
        with:
          name: tsukiko-windows-coverage
          path: coverage/lcov.info
          if-no-files-found: error

  build:
    name: Сборка дистрибутива (EXE и Setup)
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        !contains(github.event.head_commit.message, '[skip-windows]') &&
        !contains(github.event.head_commit.message, '[build-macos]') &&
        (
          contains(github.event.head_commit.message, '[build]') ||
          contains(github.event.head_commit.message, '[build-windows]') ||
          contains(github.event.head_commit.message, '[build-win]') ||
          contains(github.event.head_commit.message, '[windows]') ||
          contains(github.event.head_commit.message, '[release]')
        )
      )
    runs-on: windows-2025
    permissions:
      contents: write

    env:
      VULKAN_VERSION: 1.4.357.0

    steps:
      - uses: actions/checkout@v7

      - name: Проверить уникальность версии
        run: python tool/version.py build --platform windows

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Кэш движка
        id: engine-cache
        uses: actions/cache/restore@v6
        with:
          path: windows/Engine
          key: engine-${{ runner.os }}-${{ hashFiles('tool/engine-win.ps1', 'tool/nemo-engine-win.ps1', 'tool/recognizer-pcm.patch', 'tool/prompt-context.patch', 'tool/language-encoder.patch') }}

      - name: Vulkan SDK
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L `
            "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Движки Whisper и NeMo
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: .\tool\engine-win.ps1

      - name: Реальный Whisper · очередь из десяти записей (CPU)
        run: python tool/whisper_queue_test.py --cli windows/Engine/tsukiko-recognizer-cpu.exe --server windows/Engine/tsukiko-dictation-cpu.exe

      - name: Движок в кэш
        if: always() && steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: windows/Engine
          key: engine-${{ runner.os }}-${{ hashFiles('tool/engine-win.ps1', 'tool/nemo-engine-win.ps1', 'tool/recognizer-pcm.patch', 'tool/prompt-context.patch', 'tool/language-encoder.patch') }}

      - name: Кэш ffmpeg
        id: ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            windows/Engine/ffmpeg.exe
            windows/Engine/libwinpthread-1.dll
            windows/Engine/ffmpeg-LICENSE.txt
            windows/Engine/.ffmpeg-version
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('tool/build-ffmpeg.sh') }}

      - uses: msys2/setup-msys2@v2
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          update: false
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            tar
            xz

      - name: ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: ./tool/build-ffmpeg.sh

      - name: ffmpeg в кэш
        if: always() && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            windows/Engine/ffmpeg.exe
            windows/Engine/libwinpthread-1.dll
            windows/Engine/ffmpeg-LICENSE.txt
            windows/Engine/.ffmpeg-version
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('tool/build-ffmpeg.sh') }}

      - name: Папка журналов
        run: New-Item -ItemType Directory -Force -Path logs | Out-Null

      - run: flutter pub get

      - name: Приложение
        id: app
        run: flutter build windows --release 2>&1 | Tee-Object -FilePath logs/build.txt

      - name: tsukiko-transcribe
        run: dart compile exe bin/tsukiko_transcribe.dart -o build/windows/x64/runner/Release/tsukiko-transcribe.exe

      - name: Движок в релизную папку
        run: |
          $release = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path "$release/Engine" | Out-Null
          Copy-Item "windows/Engine/*" "$release/Engine" -Recurse -Force

      - name: Установщик
        id: installer
        run: |
          if (-not (Test-Path 'windows/Engine/ffmpeg.exe')) { throw 'Нет ffmpeg.exe; установщик обязателен для выпуска' }
          choco install innosetup --no-progress -y
          $version = python tool/version.py current
          $buildNumber = (Select-String -Path pubspec.yaml -Pattern '^version:\s*\d+\.\d+\.\d+\+(\d+)\s*$').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path build/installer | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "/DMyAppBuildNumber=$buildNumber" tool\installer.iss

      - name: Собранное
        if: always() && steps.app.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: tsukiko-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Журналы
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tsukiko-windows-logs
          path: logs/
          if-no-files-found: ignore

      - name: Установщик в артефакты
        uses: actions/upload-artifact@v7
        with:
          name: tsukiko-setup
          path: build/installer/tsukiko-setup.exe
          if-no-files-found: error

      - name: Зарезервировать выпущенную версию Windows
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          $tag = python tool/version.py tag --platform windows
          git tag $tag
          git push origin "refs/tags/$tag"
