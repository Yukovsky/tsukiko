# Сборка под macOS.
#
# На каждый пуш и pull request запускается быстрая проверка (линтер и тесты).
# Полная сборка приложения (tsukiko.app), универсального CLI и образа tsukiko.dmg
# выполняется только при наличии флага [build] / [build-macos] / [release]
# в сообщении коммита на main.
# Для пропуска сборки под macOS используйте [skip-macos] или [build-windows].

name: macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверка (линтер и тесты)
    if: >-
      !contains(github.event.head_commit.message, '[skip-macos]') &&
      !contains(github.event.head_commit.message, '[build-windows]') &&
      !contains(github.event.head_commit.message, '[build-win]')
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Версия
        run: |
          python3 tool/version.py check
          python3 -m unittest discover -s tool -p test_version.py

      - name: Раскладка DMG и сохранность уже открытого установщика
        run: python3 tool/test_dmg.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Разбор
        run: flutter analyze

      - name: Нативная геометрия и сохранение плашки (Swift / C++)
        run: |
          swiftc macos/Runner/RecordingHUD.swift tool/hud_placement_test.swift -o "$RUNNER_TEMP/hud-swift-test"
          "$RUNNER_TEMP/hud-swift-test"
          cmake -S tool/native-tests -B build/native-tests
          cmake --build build/native-tests --config Release
          ctest --test-dir build/native-tests -C Release --output-on-failure

      - name: Тесты
        run: flutter test --coverage --reporter expanded

      - name: Покрытие тестами
        uses: actions/upload-artifact@v7
        with:
          name: tsukiko-macos-coverage
          path: coverage/lcov.info
          if-no-files-found: error

  build:
    name: Сборка дистрибутива (DMG и App)
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        !contains(github.event.head_commit.message, '[skip-macos]') &&
        !contains(github.event.head_commit.message, '[build-windows]') &&
        !contains(github.event.head_commit.message, '[build-win]') &&
        !contains(github.event.head_commit.message, '[windows]') &&
        (
          contains(github.event.head_commit.message, '[build]') ||
          contains(github.event.head_commit.message, '[build-macos]') ||
          contains(github.event.head_commit.message, '[release]')
        )
      )
    runs-on: macos-15
    # Секреты подписи лежат в окружении release, а оно открыто только
    # ветке main и тегам v*: ни одна другая ветка и ни один pull request
    # до сертификата не доберётся.
    environment: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Проверить уникальность версии
        run: python3 tool/version.py build --platform macos

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Rosetta (для x86_64 среза CLI)
        run: |
          /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license || true

      - name: Кэш движка
        id: engine-cache
        uses: actions/cache/restore@v6
        with:
          path: macos/Engine
          key: engine-${{ runner.os }}-${{ hashFiles('tool/engine.sh', 'tool/nemo-engine.sh', 'tool/recognizer-pcm.patch', 'tool/prompt-context.patch', 'tool/language-encoder.patch') }}

      - name: Установка CMake
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          command -v cmake >/dev/null || brew install cmake

      - name: Движки Whisper и NeMo
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: ./tool/engine.sh

      - name: Реальный Whisper · очередь из десяти записей
        run: python3 tool/whisper_queue_test.py --cli macos/Engine/tsukiko-recognizer --server macos/Engine/tsukiko-dictation

      - name: Движок в кэш
        if: always() && steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: macos/Engine
          key: engine-${{ runner.os }}-${{ hashFiles('tool/engine.sh', 'tool/nemo-engine.sh', 'tool/recognizer-pcm.patch', 'tool/prompt-context.patch', 'tool/language-encoder.patch') }}

      - name: Папка журналов
        run: mkdir -p logs

      - run: flutter pub get

      - name: Приложение
        id: app
        run: set -o pipefail; flutter build macos --release 2>&1 | tee logs/build.txt

      - name: Импорт сертификата для постоянной подписи
        env:
          SIGNING_CERT: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERT" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "Нет MACOS_SIGNING_P12_BASE64 или MACOS_SIGNING_P12_PASSWORD: выпуск без постоянной подписи запрещён." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/tsukiko-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/tsukiko-signing.p12"
          printf '%s' "$SIGNING_CERT" | base64 -D > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -Eq 'Apple Development|Developer ID Application'
          rm -f "$certificate"
          echo "TSUKIKO_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.MACOS_TEAM_ID }}" ]; then
            echo "TSUKIKO_EXPECTED_TEAM=${{ secrets.MACOS_TEAM_ID }}" >> "$GITHUB_ENV"
          fi

      - name: Подпись и вложенные программы
        id: sign
        run: set -o pipefail; ./tool/sign.sh 2>&1 | tee logs/sign.txt

      - name: Образ DMG
        id: dmg
        run: |
          set -o pipefail
          ./tool/dmg.sh 2>&1 | tee logs/dmg.txt
          build/dmg-tools-venv/bin/python3 tool/verify-dmg.py build/tsukiko.dmg

      - name: Нотаризация и степлинг
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -o pipefail
          if [ -z "$NOTARY_KEY" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER" ]; then
            echo "Нет ключа App Store Connect: нотаризация пропущена."
            exit 0
          fi
          if ! codesign -dvv build/macos/Build/Products/Release/tsukiko.app 2>&1 |
            grep -q 'Authority=Developer ID Application'; then
            echo "Подпись не Developer ID Application: нотаризация пропущена."
            exit 0
          fi
          key="$RUNNER_TEMP/notary-key.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$NOTARY_KEY" | base64 -D > "$key"
          xcrun notarytool submit build/tsukiko.dmg \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            --wait --output-format json | tee logs/notary.json
          python3 - <<'PY'
          import json, sys
          result = json.load(open("logs/notary.json"))
          if result.get("status") != "Accepted":
              sys.exit("Нотаризация не принята: %s" % result.get("status"))
          PY
          xcrun stapler staple build/tsukiko.dmg
          xcrun stapler validate build/tsukiko.dmg

      - name: Удалить связку ключей с сертификатом
        if: always()
        run: |
          if [ -n "$TSUKIKO_SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$TSUKIKO_SIGNING_KEYCHAIN" || true
          fi

      - name: Приложение в артефакты
        if: always() && steps.sign.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: tsukiko-macos-app
          path: build/macos/Build/Products/Release/tsukiko.app
          if-no-files-found: error

      - name: Образ DMG в артефакты
        if: steps.dmg.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: tsukiko-macos-dmg
          path: build/tsukiko.dmg
          if-no-files-found: error

      - name: Журналы
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tsukiko-macos-logs
          path: logs/
          if-no-files-found: ignore

      - name: Зарезервировать выпущенную версию macOS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tag=$(python3 tool/version.py tag --platform macos)
          git tag "$tag"
          git push origin "refs/tags/$tag"
